<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Highway Intersections Visualization</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html,body,#map { height: 100%; margin: 0; padding: 0; background: #fbfbfb; }
    #map { width: 100vw; height: 100vh; }
    .legend { 
        background: rgba(255, 255, 255, 0.9); 
        padding: 10px 12px; 
        font: 14px/18px Arial, sans-serif; 
        border-radius: 4px;
        box-shadow: 0 1px 5px rgba(0,0,0,0.4);
    }
    .legend b { display: block; margin-bottom: 6px; font-size: 16px; }
    .countbox { position: absolute; left: 10px; top: 10px; z-index: 400; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="countbox">
    <div class="legend" id="legend"><b>Loading Data...</b><br>Parsing CSV...</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Initialize map with preferCanvas: true for performance with many points
    const map = L.map('map', {
        preferCanvas: true,
        worldCopyJump: true
    }).setView([39.8, -98.6], 5);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);

    // Fetch the CSV file directly
    fetch('mainland_intersections.csv')
      .then(response => {
        if (!response.ok) throw new Error("HTTP error " + response.status);
        return response.text();
      })
      .then(csvText => {
        const lines = csvText.split('\n');
        
        // CSV Headers are likely: lat, lon, degree (or similar order)
        // We detect the index of lat/lon from the header row
        const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
        const latIndex = headers.indexOf('lat');
        const lonIndex = headers.indexOf('lon');

        if (latIndex === -1 || lonIndex === -1) {
            throw new Error("Could not find 'lat' or 'lon' headers in CSV.");
        }

        const nodesLayer = L.layerGroup();
        let pointCount = 0;
        let bounds = L.latLngBounds();

        // Loop through lines (skipping header)
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;

            const cols = line.split(',');
            const lat = parseFloat(cols[latIndex]);
            const lon = parseFloat(cols[lonIndex]);

            // Validation
            if (isNaN(lat) || isNaN(lon)) continue;

            pointCount++;
            const latlng = [lat, lon];
            bounds.extend(latlng);

            // Create a lightweight circle marker
            L.circleMarker(latlng, {
                radius: 2,           // Small dot
                color: '#4cc9f0',    // Bright blue/cyan
                fillColor: '#4cc9f0',
                fillOpacity: 0.8,
                weight: 0            // No border for performance
            }).addTo(map);
        }

        // Auto-zoom to fit all points
        if (bounds.isValid()) {
            map.fitBounds(bounds, {padding: [50, 50]});
        }

        // Update Legend
        const legend = document.getElementById('legend');
        legend.innerHTML = `
          <b>Highway Network</b>
          Total Intersections: <b>${pointCount.toLocaleString()}</b>
          <hr style="margin: 8px 0; border: 0; border-top: 1px solid #ccc;">
          <div><span style="color:#4cc9f0; font-size: 18px;">●</span> Intersection Point</div>
          <div style="margin-top:8px; font-size:12px; color:#555">
            Source: mainland_intersections.csv
          </div>`;
      })
      .catch(err => {
        const legend = document.getElementById('legend');
        legend.innerHTML = `<b>Error loading Data</b><br><span style="color:red; font-size:12px">${err}</span><br><br>Did you run <code>python3 -m http.server</code>?`;
        console.error(err);
      });
  </script>
</body>
</html>
